# Merge into your Codex config and replace the installation path if needed.
# Click the GUI's MCP button before using document tools.
[mcp_servers.seamly2d]
command = 'C:\Program Files\Seamly2D\seamly2d-mcp.exe'
tool_timeout_sec = 90

